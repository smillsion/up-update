services:
  up-update:
    image: up-update:local
    build: .
    container_name: up-update
    restart: unless-stopped
    ports:
      - "${UP_UPDATE_HTTP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UP_UPDATE_ADMIN_USERNAME: ${UP_UPDATE_ADMIN_USERNAME:-admin}
      UP_UPDATE_ADMIN_PASSWORD: ${UP_UPDATE_ADMIN_PASSWORD:?set UP_UPDATE_ADMIN_PASSWORD in .env}
      UP_UPDATE_ENCRYPTION_KEY: ${UP_UPDATE_ENCRYPTION_KEY:?set UP_UPDATE_ENCRYPTION_KEY in .env}
      UP_UPDATE_SECURE_COOKIES: ${UP_UPDATE_SECURE_COOKIES:-false}
    volumes:
      - up-update-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  up-update-data:
